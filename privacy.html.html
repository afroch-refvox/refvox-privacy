  .footer { text-align:center; font-size:12px; color:var(--text2); padding:14px 0 24px; }

  .pp-home:hover { background:var(--primary); color:#fff; border-color:var(--primary); }

  .lang-toggle button { font-size:11px; font-weight:700; padding:4px 9px; border-radius:20px; cursor:pointer;

  .lang-toggle button:hover { border-color:var(--primary); color:var(--primary); }
  .lang-toggle button.active { background:var(--primary); color:#fff; border-color:var(--primary); }

const PRIVACY_LANGS = Object.keys(PRIVACY);
const RTL_LANGS = ["ar", "he", "fa", "ur"];
const FALLBACK = "en";

function renderPrivacy(lang) {
  const contentLang = PRIVACY[lang] ? lang : (lang === 'de-at' && PRIVACY.de ? 'de' : FALLBACK);
  const d = PRIVACY[contentLang];
  document.title = d.docTitle;
  document.documentElement.lang = contentLang;
  document.documentElement.dir = RTL_LANGS.indexOf(contentLang) !== -1 ? 'rtl' : 'ltr';
  let html = '<div class="card"><h1>' + d.h1 + '</h1><p>' + d.lead + '</p></div>';
  d.cards.forEach(function (c) {
    html += '<div class="card"><h2>' + c.h + '</h2>';
    (c.p || []).forEach(function (p) { html += '<p>' + p + '</p>'; });
    if (c.ul) { html += '<ul>' + c.ul.map(function (li) { return '<li>' + li + '</li>'; }).join('') + '</ul>'; }
    (c.p2 || []).forEach(function (p) { html += '<p>' + p + '</p>'; });
    html += '</div>';
  });
  html += '<div class="footer">' + d.footer + '</div>';
  document.getElementById('privacy-content').innerHTML = html;
  PRIVACY_LANGS.forEach(function (l) {
    const b = document.getElementById('lt-' + l);
    if (b) b.classList.toggle('active', contentLang === l);
  });
  const hb = document.getElementById('pp-home');
  if (hb && d.home) hb.textContent = d.home;
}

function setPrivacyLang(lang) {
  try { localStorage.setItem('appLang', lang); } catch (e) {}
  renderPrivacy(lang);
}

try { if (localStorage.getItem('darkMode') === 'true') document.body.classList.add('dark'); } catch (e) {}
(function () {
  let lang = FALLBACK;
  try { lang = localStorage.getItem('appLang') || FALLBACK; } catch (e) {}
  renderPrivacy(lang);
})();
